name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Reuse the exact same checks at the tagged commit. Invalid stable-version
    # tags are rejected by package.sh before any publishing job can start.
    name: Test and package tagged commit
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chargeboost-extension
          path: dist
      - name: Verify the tested archive
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/chargeboost@rackow.io.shell-extension.zip dist/SHA256SUMS \
            --verify-tag --title "Charge Boost $RELEASE_TAG" --generate-notes
