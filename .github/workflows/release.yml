name: Release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Analyze the complete history, but publish only the commit CI tested.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked release tooling
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chargeboost-extension
          path: dist
      - name: Verify the tested archive
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Release from Conventional Commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
